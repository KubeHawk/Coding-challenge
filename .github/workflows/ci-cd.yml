name: CI

on:
  pull_request:
    branches: [develop]

env:
  GCP_REGION: europe-west1
  IMAGE_NAME: crewmeister-app

jobs:
  # ─── Job 1: Build & Push image to GCP Artifact Registry ──────────────────
  push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image
        run: |
          IMAGE_URL="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/crewmeister/${{ env.IMAGE_NAME }}"
          docker build -t $IMAGE_URL:latest -t $IMAGE_URL:${{ github.sha }} .
          docker push $IMAGE_URL:latest
          docker push $IMAGE_URL:${{ github.sha }}
