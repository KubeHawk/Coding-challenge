name: CI

on:
  pull_request:
    branches: [develop]

env:
  GCP_REGION: europe-west1
  IMAGE_NAME: crewmeister-app

jobs:
  # ─── Job 1: Build & Push image ────────────────────────────────────────────
  push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/crewmeister/${{ env.IMAGE_NAME }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/crewmeister/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Deploy Helm chart to GKE ─────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --zone ${{ secrets.GCP_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy Helm chart
        run: |
          helm upgrade --install crewmeister ./helm/crewmeister \
            --namespace crewmeister \
            --create-namespace \
            --set image.repository="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/crewmeister/${{ env.IMAGE_NAME }}" \
            --set image.tag="${{ github.sha }}" \
            --set env.SPRING_DATASOURCE_URL="jdbc:mysql://${{ secrets.CLOUD_SQL_IP }}:3306/challenge?createDatabaseIfNotExist=true" \
            --set env.SPRING_DATASOURCE_WRITER_URL="jdbc:mysql://${{ secrets.CLOUD_SQL_IP }}:3306/challenge?createDatabaseIfNotExist=true" \
            --set-string env.SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --wait \
            --timeout 5m