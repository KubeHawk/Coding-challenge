name: Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TF_DIR: terraform/gcp

jobs:
  init-and-plan:
    name: Terraform Init & Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/terraform-key.json

      - name: Terraform Init & Validate
        working-directory: ${{ env.TF_DIR }}
        env:
          GOOGLE_BACKEND_CREDENTIALS: /tmp/terraform-key.json
        run: |
          terraform init
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="gcp_credentials=$(cat /tmp/terraform-key.json)" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="zone=${{ secrets.GCP_ZONE }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/terraform-key.json

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: init-and-plan
    environment: production    # ← approval gate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/terraform-key.json

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          GOOGLE_BACKEND_CREDENTIALS: /tmp/terraform-key.json
        run: terraform init

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/terraform-key.json