clusterName: "elasticsearch"
nodeGroup: "master"

replicas: 1
minimumMasterNodes: 1

# ─── Single node — must clear initial_master_nodes ───────────────────────────
clusterInitialMasterNodes: []

esConfig:
  elasticsearch.yml: |
    cluster.name: elasticsearch
    network.host: 0.0.0.0
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false

# ─── Readiness probe — yellow is fine for single node ────────────────────────
readinessProbe:
  exec:
    command:
      - bash
      - -c
      - |
        curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

esJavaOpts: "-Xmx512m -Xms512m"

# ─── Persistence ──────────────────────────────────────────────────────────────
persistence:
  enabled: true
  size: 5Gi

antiAffinity: "soft"