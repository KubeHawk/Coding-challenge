clusterName: "elasticsearch"
nodeGroup: "master"

replicas: 1
minimumMasterNodes: 1

# ─── Single node fix ──────────────────────────────────────────────────────────
# Override only cluster.initial_master_nodes to empty
# discovery.type single-node handles the rest
extraEnvs:
  - name: cluster.initial_master_nodes
    value: ""

esConfig:
  elasticsearch.yml: |
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false

# ─── Readiness probe ──────────────────────────────────────────────────────────
readinessProbe:
  exec:
    command:
      - bash
      - -c
      - |
        curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

esJavaOpts: "-Xmx512m -Xms512m"

persistence:
  enabled: true
  size: 5Gi

antiAffinity: "soft"