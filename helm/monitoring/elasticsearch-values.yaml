clusterName: "elasticsearch"
nodeGroup: "master"

replicas: 1
minimumMasterNodes: 1

# ─── Override the cluster.initial_master_nodes env var set by the chart ───────
extraEnvs:
  - name: cluster.initial_master_nodes
    value: ""
  - name: discovery.type
    value: single-node
  - name: xpack.security.enabled
    value: "false"
  - name: xpack.security.transport.ssl.enabled
    value: "false"
  - name: xpack.security.http.ssl.enabled
    value: "false"

# ─── Readiness probe ──────────────────────────────────────────────────────────
readinessProbe:
  exec:
    command:
      - bash
      - -c
      - |
        curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

esJavaOpts: "-Xmx512m -Xms512m"

persistence:
  enabled: true
  size: 5Gi

antiAffinity: "soft"