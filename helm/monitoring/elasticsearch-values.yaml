clusterName: "elasticsearch"
nodeGroup: "master"
replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

esJavaOpts: "-Xmx512m -Xms512m"

persistence:
  enabled: true
  size: 5Gi

antiAffinity: "soft"

# Enable X-Pack security so that TLS and credential auth are active.
# The chart auto-generates the elasticsearch-master-certs and
# elasticsearch-master-credentials secrets consumed by Kibana and Logstash.
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: true
    xpack.security.transport.ssl.enabled: true
    xpack.security.transport.ssl.verification_mode: certificate
    xpack.security.http.ssl.enabled: true