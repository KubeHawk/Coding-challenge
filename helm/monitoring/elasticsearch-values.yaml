clusterName: "elasticsearch"
nodeGroup: "master"
replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

esJavaOpts: "-Xmx512m -Xms512m"

persistence:
  enabled: true
  size: 5Gi

antiAffinity: "soft"