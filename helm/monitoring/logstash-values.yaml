logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false

logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port  => 5000
        codec => json_lines
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch-master:9200"]
        index => "crewmeister-logs-%{+YYYY.MM.dd}"
        ilm_enabled => false
      }
    }

service:
  type: ClusterIP
  ports:
    - name: tcp-input
      port: 5000
      protocol: TCP
      targetPort: 5000

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
