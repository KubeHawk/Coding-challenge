apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "crewmeister.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crewmeister.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "crewmeister.fullname" . }}-gateway
      namespace: {{ .Release.Namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "crewmeister.fullname" . }}
          port: {{ .Values.service.port }}