apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: crewmeister-health-check
  namespace: crewmeister
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    logConfig:
      enabled: false
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /actuator/health/liveness
  targetRef:
    group: ""
    kind: Service
    name: crewmeister