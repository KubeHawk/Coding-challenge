apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "crewmeister.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crewmeister.labels" . | nindent 4 }}
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80