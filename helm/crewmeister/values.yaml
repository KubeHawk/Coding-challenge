# ─── App ──────────────────────────────────────────────────────────────────────
replicaCount: 1

image:
  repository: crewmeister-app
  tag: latest
  pullPolicy: IfNotPresent

# ─── Service ──────────────────────────────────────────────────────────────────
service:
  type: LoadBalancer
  port: 8080

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ─── Health probes ────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10

# ─── Environment variables ────────────────────────────────────────────────────
# All DB values are injected by Terraform at deploy time
env:
  SPRING_APPLICATION_NAME: crewmeister-challenge
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_WRITER_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""