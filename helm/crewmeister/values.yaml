# ─── App ──────────────────────────────────────────────────────────────────────
replicaCount: 1

image:
  repository: crewmeister-app   # local image name built with minikube/kind
  tag: latest
  pullPolicy: IfNotPresent       # use local image, don't pull from registry

# ─── Service ──────────────────────────────────────────────────────────────────
service:
  type: NodePort
  port: 8080
  nodePort: 30080                # access via minikube ip:30080

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false                 # enable if you add the NGINX ingress addon

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ─── Health probes ────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10

# ─── MySQL (runs as a pod inside the cluster) ─────────────────────────────────
mysql:
  enabled: true
  image: mysql:8.0
  database: challenge
  username: crewmeister
  # Passwords are in secrets.yaml — not here
  port: 3306
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  storage: 1Gi

# ─── Environment variables passed to the app ──────────────────────────────────
env:
  SPRING_APPLICATION_NAME: crewmeister-challenge
